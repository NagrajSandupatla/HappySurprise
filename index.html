<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise Wishes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f1c;--bg2:#4a1a2e;--rose:#e8b4b8;--gold:#d9b779;--text:#fbeff0;--card:rgba(255,255,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#2a0f1c;--bg2:#4a1a2e}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg));color:var(--text);font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;overflow-x:hidden}
.serif,.script{font-family:'Playfair Display',Georgia,serif;font-style:italic}.script{font-weight:700}
/* form */
#create{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:2.1rem;text-align:center;color:var(--rose)}
.sub{text-align:center;opacity:.8;margin:6px 0 24px}
fieldset{border:1px solid rgba(217,183,121,.35);background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px}
legend{font-family:'Playfair Display',Georgia,serif;color:var(--gold);padding:0 8px}
label{display:block;font-size:.85rem;margin:10px 0 4px;opacity:.85}
input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid rgba(232,180,184,.4);background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:1rem}
textarea{min-height:80px;resize:vertical}
button{cursor:pointer;font:inherit}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:30px;background:linear-gradient(135deg,var(--gold),var(--rose));color:#3a1224;font-weight:700;font-size:1.05rem;margin-top:6px}
#result{display:none;text-align:center;border:1px solid var(--gold);border-radius:14px;padding:18px;background:var(--card)}
#result input{text-align:center;margin:10px 0}
.hint{font-size:.8rem;opacity:.65;margin-top:6px}
/* viewer */
#view{display:none;position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;text-align:center;padding:24px 20px 90px;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .9s;background-size:cover;background-position:center}
.slide.on{opacity:1;visibility:visible}
.slide.img::before{content:"";position:fixed;inset:-30px;background-image:var(--bg);background-size:cover;background-position:center;filter:blur(24px) brightness(.45)}
.pic{display:block;max-width:100%;max-height:52vh;max-height:52dvh;width:auto;height:auto;object-fit:contain;margin:0 auto 16px;border-radius:12px;border:1px solid rgba(217,183,121,.6);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.slide.img .glass{padding:18px 16px;font-size:clamp(1rem,3.6vw,1.35rem)}
.in{position:relative;max-width:620px;width:100%;margin:auto}
.slide.on .in{animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.big{font-size:clamp(2rem,8vw,3.6rem);line-height:1.2;color:var(--rose)}
.name{font-size:clamp(2.4rem,10vw,4.4rem);color:var(--gold);margin:8px 0 18px}
.msg{font-size:clamp(1.1rem,4vw,1.5rem);line-height:1.7}
.glass{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(217,183,121,.5);border-radius:20px;padding:28px 22px;white-space:pre-wrap}
.letter{background:rgba(255,248,240,.08);border:1px solid var(--gold);border-radius:6px;padding:30px 24px;text-align:left;white-space:pre-wrap;max-height:78vh;overflow:auto;font-size:clamp(1.05rem,3.8vw,1.35rem);line-height:1.8;box-shadow:0 0 40px rgba(217,183,121,.2)}
.letter .from{display:block;text-align:right;margin-top:18px;color:var(--gold);font-size:1.7rem}
.nav{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:5}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold);font-size:1.3rem}
.dots{display:flex;gap:8px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:var(--gold)}
.heart{position:absolute;bottom:-30px;color:var(--rose);opacity:.5;animation:fl linear infinite;pointer-events:none}
@keyframes fl{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#msgbox{padding:60px 20px;text-align:center}
</style>
</head>
<body>
<div id="create">
  <h1>💌 Create a Surprise</h1>
  <p class="sub">Fill in the details, get a link, share it with your loved one.</p>
  <fieldset><legend>Page 1 · The Wish</legend>
    <label>Occasion</label>
    <select id="occ"><option>Happy Birthday</option><option>Happy Anniversary</option><option>Happy Wedding Day</option><option>I Love You</option><option>Congratulations</option></select>
    <label>Their name</label><input id="to" placeholder="e.g. Priya">
    <label>Your name</label><input id="from" placeholder="e.g. Rahul">
    <label>Short wish message</label><textarea id="m1" placeholder="Wishing you a day as beautiful as you are…"></textarea>
  </fieldset>
  <fieldset><legend>Page 2 · Photo + Message</legend>
    <label>Background photo (optional)</label><input type="file" id="i2" accept="image/*">
    <label>Message</label><textarea id="m2" placeholder="Every moment with you is a treasure…"></textarea>
  </fieldset>
  <fieldset><legend>Page 3 · Photo + Message</legend>
    <label>Background photo (optional)</label><input type="file" id="i3" accept="image/*">
    <label>Message</label><textarea id="m3" placeholder="You make my world brighter…"></textarea>
  </fieldset>
  <fieldset><legend>Page 4 · Your Letter</legend>
    <label>Write freely from the heart</label><textarea id="m4" style="min-height:150px" placeholder="My dearest…"></textarea>
    <p class="hint">No photo chosen? A soft romantic background is used.</p>
  </fieldset>
  <button class="btn" id="go">Generate my link ✨</button>
  <p class="hint" id="err" style="text-align:center;color:#ffb4b4"></p>
  <div id="result" style="margin-top:18px">
    <p>Your surprise is ready! Share this link:</p>
    <input id="link" readonly>
    <p class="hint" id="len"></p><button class="btn" id="copy">Copy link</button>
    <button class="btn" id="open" style="margin-top:10px;background:none;border:1px solid var(--gold);color:var(--gold)">Preview</button>
  </div>
</div>

<div id="msgbox" style="display:none"></div>
<div id="view">
  <div class="nav"><button id="prev" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="Next">›</button></div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var cur=0,slides=[];
function b64e(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pack(o){var u=new TextEncoder().encode(JSON.stringify(o));
 if(window.CompressionStream){var c=new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64e(new Uint8Array(await new Response(c).arrayBuffer()))}
 return 'r'+b64e(u)}
async function unpack(s){var t=s[0],u=b64d(s.slice(1));
 if(t==='z'){var c=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));u=new Uint8Array(await new Response(c).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(u))}
window.addEventListener('hashchange',function(){location.reload()});
if(location.hash.length>1)show(location.hash.slice(1));
function compress(file){return new Promise(function(res){
  if(!file)return res("");
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.5))};im.onerror=function(){res("")};im.src=r.result};
  r.onerror=function(){res("")};r.readAsDataURL(file)})}
$('go').onclick=async function(){
  $('err').textContent='';
  if(!$('to').value.trim()){$('err').textContent='Please enter their name.';return}
  $('go').textContent='Creating…';
  try{
    var d={occ:$('occ').value,to:$('to').value.trim(),from:$('from').value.trim(),m1:$('m1').value,m2:$('m2').value,m3:$('m3').value,m4:$('m4').value,
      i2:await compress($('i2').files[0]),i3:await compress($('i3').files[0])};
    var url=location.href.split('#')[0]+'#'+await pack(d);
    $('link').value=url;$('result').style.display='block';$('open').onclick=function(){window.open(url,'_blank')};
    $('len').textContent=url.length>20000?'This link is long because of the photos. Share it by email or a link shortener if WhatsApp cuts it.':'';
    $('result').scrollIntoView({behavior:'smooth'});
  }catch(e){$('err').textContent='Could not create the link. Try smaller photos.'}
  $('go').textContent='Generate my link ✨';
};
$('copy').onclick=function(){$('link').select();try{navigator.clipboard.writeText($('link').value)}catch(e){document.execCommand('copy')}$('copy').textContent='Copied ✓'};
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function show(id){
  $('create').style.display='none';
  var d=null;
  try{d=await unpack(id)}catch(e){}
  if(!d){var b=$('msgbox');b.style.display='block';b.innerHTML='<h1>💔 Surprise not found</h1><p class="sub">This link looks incomplete. Please ask the sender to share it again.</p>';return}
  var v=$('view');v.style.display='block';
  var bg2=d.i2?'url('+d.i2+')':'linear-gradient(160deg,#7a2745,#2a0f1c)';
  var bg3=d.i3?'url('+d.i3+')':'linear-gradient(200deg,#8b4a5c,#3a1224)';
  var html=[
   '<div class="slide"><div class="in"><p class="script" style="font-size:1.8rem;color:var(--gold)">A surprise for you</p><h2 class="serif big" style="margin-top:12px">'+esc(d.occ)+'</h2><h2 class="script name">'+esc(d.to)+'</h2><p class="msg serif" style="font-style:italic;white-space:pre-wrap">'+esc(d.m1)+'</p></div></div>',
   '<div class="slide img" style="--bg:'+bg2+'"><div class="in">'+(d.i2?'<img class="pic" src="'+d.i2+'" alt="">':'')+'<div class="glass msg serif">'+esc(d.m2)+'</div></div></div>',
   '<div class="slide img" style="--bg:'+bg3+'"><div class="in">'+(d.i3?'<img class="pic" src="'+d.i3+'" alt="">':'')+'<div class="glass msg serif">'+esc(d.m3)+'</div></div></div>',
   '<div class="slide"><div class="in"><div class="letter serif">'+esc(d.m4)+(d.from?'<span class="from script">With love, '+esc(d.from)+'</span>':'')+'</div></div></div>'
  ];
  v.insertAdjacentHTML('afterbegin',html.join(''));
  slides=v.querySelectorAll('.slide');
  $('dots').innerHTML='<i></i><i></i><i></i><i></i>';
  for(var i=0;i<14;i++){var h=document.createElement('span');h.className='heart';h.textContent='♥';
    h.style.cssText='left:'+Math.random()*100+'%;font-size:'+(12+Math.random()*22)+'px;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:'+Math.random()*8+'s';v.appendChild(h)}
  go(0);
  $('next').onclick=function(){go(cur+1)};$('prev').onclick=function(){go(cur-1)};
  var sx=0;v.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  v.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))});
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
}
function go(n){if(n<0||n>=slides.length)return;cur=n;
  slides.forEach(function(s,i){s.classList.toggle('on',i===n)});
  document.querySelectorAll('.dots i').forEach(function(s,i){s.classList.toggle('on',i===n)})}
</script>
</body>
</html>
